name: Mirror Sync

on:
  push:
    branches: ["**"]
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  codeberg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pixta-dev/repository-mirroring-action@v1
        with:
          target_repo_url: git@codeberg.org:<your-codeberg-username>/<your-repo-name>.git
          ssh_private_key: ${{ secrets.CODEBERG_SSH_PRIVATE_KEY }}
