name: CI

on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!**.md"
      - "!.github/**"
      - ".github/workflows/build_push.yml"
  workflow_dispatch:
    inputs:
      build_all:
        description: "Rebuild every extension, ignoring the diff"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix-count: ${{ steps.generate.outputs.matrix-count }}
      matrix0: ${{ steps.generate.outputs.matrix0 }}
      matrix1: ${{ steps.generate.outputs.matrix1 }}
      matrix2: ${{ steps.generate.outputs.matrix2 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: generate
        run: |
          if [ "${{ inputs.build_all }}" = "true" ]; then
            python3 .github/scripts/generate-build-matrices.py --all
          else
            python3 .github/scripts/generate-build-matrices.py \
              "${{ github.event.before }}" "${{ github.sha }}"
          fi

  build:
    needs: prepare
    if: ${{ needs.prepare.outputs.matrix-count != '0' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs['matrix0'] || '{"module":[]}') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | base64 -d > signingkey.jks

      - name: Build & sign ${{ matrix.module }}
        env:
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          module="${{ matrix.module }}"
          if [ "$module" = "." ]; then
            ./gradlew assembleRelease --stacktrace
          else
            gradle_target=$(echo "$module" | sed 's#/#:#g')
            ./gradlew "${gradle_target}:assembleRelease" --stacktrace
          fi

      - name: Collect APKs
        run: |
          mkdir -p apk-output
          find . -path "*build/outputs/apk/release/*.apk" -exec cp {} apk-output/ \;

      - uses: actions/upload-artifact@v4
        with:
          name: apks-${{ strategy.job-index }}
          path: apk-output/*.apk
          retention-days: 1
          if-no-files-found: ignore

  publish:
    needs: [prepare, build]
    if: ${{ always() && needs.prepare.outputs.matrix-count != '0' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      DEPLOY_REPO: NotScrape/extensions
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.DEPLOY_REPO }}
          ref: repo
          path: repo-branch
          token: ${{ secrets.DEPLOY_REPO_TOKEN }}
        continue-on-error: true

      - name: Ensure repo branch checkout exists
        run: |
          if [ ! -d repo-branch/.git ]; then
            mkdir -p repo-branch
            cd repo-branch
            git init
            git checkout -b repo
          fi

      - uses: actions/download-artifact@v4
        with:
          pattern: apks-*
          path: apk-input
          merge-multiple: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install androguard --break-system-packages

      - name: Generate repo index
        run: |
          python3 .github/scripts/create-repo.py apk-input repo-branch

      - name: Commit & push to deploy repo
        working-directory: repo-branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.DEPLOY_REPO_TOKEN }}@github.com/${{ env.DEPLOY_REPO }}.git" 2>/dev/null || \
            git remote add origin "https://x-access-token:${{ secrets.DEPLOY_REPO_TOKEN }}@github.com/${{ env.DEPLOY_REPO }}.git"
          git add -A
          git diff --cached --quiet && echo "No changes to publish" && exit 0
          git commit -m "Update extensions repo ($(date -u +%Y-%m-%dT%H:%M:%SZ)) - source: ${{ github.repository }}@${{ github.sha }}"
          git push origin HEAD:repo --force
