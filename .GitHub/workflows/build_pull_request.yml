name: PR check

on:
  pull_request:
    paths:
      - "**"
      - "!**.md"
      - "!.github/**"
      - ".github/workflows/build_pull_request.yml"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix-count: ${{ steps.generate.outputs.matrix-count }}
      matrix0: ${{ steps.generate.outputs.matrix0 }}
      matrix1: ${{ steps.generate.outputs.matrix1 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: generate
        run: |
          python3 .github/scripts/generate-build-matrices.py \
            "origin/${{ github.base_ref }}" "HEAD"

  build:
    needs: prepare
    if: ${{ needs.prepare.outputs.matrix-count != '0' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs['matrix0'] || '{"module":[]}') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build ${{ matrix.module }}
        run: |
          module="${{ matrix.module }}"
          if [ "$module" = "." ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle_target=$(echo "$module" | sed 's#/#:#g')
            ./gradlew "${gradle_target}:assembleDebug" --stacktrace
          fi
